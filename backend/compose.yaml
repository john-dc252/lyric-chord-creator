services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lcc
      POSTGRES_PASSWORD: lcc
      POSTGRES_DB: lcc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lcc -d lcc"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
